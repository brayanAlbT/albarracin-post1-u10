# Identificación del proyecto en SonarQube / SonarCloud
sonar.projectKey=com.universidad:envios-service
sonar.projectName=Envios Service
sonar.projectVersion=1.0

# Rutas de código fuente, pruebas y binarios compilados
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.binaries=target/classes

# Ruta del reporte XML generado por JaCoCo (mvn clean verify)
sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Servidor SonarQube local (Docker). Para SonarCloud cambiar a https://sonarcloud.io
sonar.host.url=http://localhost:9000
sonar.qualitygate.wait=false

# Exclusiones: no se excluye ninguna clase porque el proyecto solo contiene lógica de negocio pura
# sonar.exclusions=
